name: Firmware build
description: Trigger a FanchmWrt firmware build with OpenWrt target names
title: "[Firmware Build] "
labels:
  - build-firmware
body:
  - type: markdown
    attributes:
      value: |
        Anyone can submit a build request. The bot validates the request and applies daily rate limits before starting a build. If automatic approval is denied, the repository owner can still review it and add the `approved-build` label. Use OpenWrt target, subtarget, and device profile names.

  - type: input
    id: upstream_ref
    attributes:
      label: Upstream ref
      description: Branch, tag, or full commit SHA from fanchmwrt/fanchmwrt
      placeholder: fanchmwrt-25.12.4
    validations:
      required: true

  - type: dropdown
    id: architecture
    attributes:
      label: Architecture
      description: Package architecture family used to verify the selected target
      options:
        - mipsel
        - arm
        - x86
    validations:
      required: true

  - type: input
    id: target
    attributes:
      label: Target
      description: OpenWrt target name
      placeholder: rockchip
    validations:
      required: true

  - type: input
    id: subtarget
    attributes:
      label: Subtarget
      description: OpenWrt subtarget name
      placeholder: armv8
    validations:
      required: true

  - type: input
    id: profile
    attributes:
      label: Profile
      description: OpenWrt device profile name
      placeholder: friendlyarm_nanopi-r5c
    validations:
      required: true
