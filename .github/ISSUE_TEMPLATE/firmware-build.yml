name: Firmware build
description: Trigger a FanchmWrt firmware build with OpenWrt target names
title: "[Firmware Build] "
labels:
  - build-firmware
body:
  - type: markdown
    attributes:
      value: |
        Anyone can submit a build request. Before counting or compiling, the bot uses OpenWrt's target metadata to reject nonexistent target, subtarget, profile, and architecture combinations. If the same valid device and upstream commit were built successfully in the past 30 days and its artifact is still available, the bot returns that Actions run without consuming the daily limit. Use OpenWrt target, subtarget, and device profile names.

        A build that fails or is cancelled leaves the issue open and marks it with a yellow `build-attention` label so it can be found again.

  - type: dropdown
    id: upstream_ref
    attributes:
      label: Upstream ref
      description: "Version to build, newest first. A fanchmwrt-* entry builds that maintenance branch head and carries the private fanchmwrt layer (fwxd, the luci-app-fwx-* app centre); the v* entry below it is the released upstream tree without that layer, so a stock configuration fails verification on it. Pick the fanchmwrt-* entry unless you deliberately need the bare release. The device backport repository works with both: the builder derives the matching v* ref from this selection. Options are synchronized with the upstream tags and branches by a scheduled workflow, which also withdraws a maintenance branch upstream declares outdated."
      options:
        # BEGIN upstream_ref options (auto-generated by .github/workflows/sync-upstream-refs.yml)
        - fanchmwrt-25.12.6
        - v25.12.6
        - v25.12.5
        - fanchmwrt-25.12.4
        - v25.12.4
        - v25.12.3
        - fanchmwrt-25.12.2
        - v25.12.2
        - v25.12.1
        - v25.12.0
        - fanchmwrt-24.10.4
        - v24.10.4
        - v24.10.3
        - v24.10.2
        - v24.10.1
        - v24.10.0
        # END upstream_ref options (auto-generated by .github/workflows/sync-upstream-refs.yml)
      default: 0
    validations:
      required: true

  - type: input
    id: upstream_ref_override
    attributes:
      label: Upstream ref override
      description: Optional. Branch, tag, or full commit SHA that replaces the selected version, for example a commit you need to reproduce. Leave blank to build the selection above.
      placeholder: Leave blank to use the version above
    validations:
      required: false

  - type: dropdown
    id: architecture
    attributes:
      label: Architecture
      description: Package architecture family used to verify the selected target
      options:
        - mipsel
        - arm
        - x86
    validations:
      required: true

  - type: input
    id: target
    attributes:
      label: Target
      description: OpenWrt target name
      placeholder: rockchip
    validations:
      required: true

  - type: input
    id: subtarget
    attributes:
      label: Subtarget
      description: OpenWrt subtarget name
      placeholder: armv8
    validations:
      required: true

  - type: input
    id: profile
    attributes:
      label: Profile
      description: OpenWrt device profile name
      placeholder: friendlyarm_nanopi-r5c
    validations:
      required: true
