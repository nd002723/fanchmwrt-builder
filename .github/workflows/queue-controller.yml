name: Reconcile Firmware Build Queue

on:
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'

permissions:
  actions: write
  contents: read
  issues: write

concurrency:
  group: firmware-build-queue-controller
  cancel-in-progress: false

jobs:
  reconcile:
    name: Reconcile automatic build slots
    runs-on: ubuntu-22.04
    steps:
      # The script below requires scripts/lib/labels.js, and a require resolves
      # against the workspace: without this checkout the job dies with
      # MODULE_NOT_FOUND before it ever looks at the queue.
      - name: Checkout builder
        uses: actions/checkout@v5

      - name: Promote or defer queued requests
        uses: actions/github-script@v8
        env:
          GLOBAL_DAILY_LIMIT: ${{ vars.AUTO_BUILD_GLOBAL_DAILY || '3' }}
          PER_USER_DAILY_LIMIT: ${{ vars.AUTO_BUILD_PER_USER_DAILY || '1' }}
        with:
          script: |
            function positiveLimit(raw, fallback) {
              const parsed = Number.parseInt(raw, 10);
              return Number.isInteger(parsed) && parsed > 0 && parsed <= 50 ? parsed : fallback;
            }

            // Label names, colours and descriptions live in
            // scripts/lib/labels.js so the four workflows that touch them cannot
            // drift apart.
            const { ensureAllLabels } = require('./scripts/lib/labels.js');

            async function removeLabel(issueNumber, name) {
              try {
                await github.rest.issues.removeLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issueNumber,
                  name
                });
              } catch (error) {
                if (error.status !== 404) throw error;
              }
            }

            const globalLimit = positiveLimit(process.env.GLOBAL_DAILY_LIMIT, 3);
            const perUserLimit = positiveLimit(process.env.PER_USER_DAILY_LIMIT, 1);
            const now = new Date();
            const utcDate = now.toISOString().slice(0, 10);
            const todayStart = `${utcDate}T00:00:00.000Z`;
            const staleBefore = new Date(now.getTime() - 30 * 60 * 1000);
            const approvalPattern = /<!-- fanchmwrt-auto-approved date=(\d{4}-\d{2}-\d{2}) requester=([A-Za-z0-9-]+) -->/;
            const releasePattern = /<!-- fanchmwrt-auto-slot-released run=(\d+) -->/;
            const dispatchPattern = /<!-- fanchmwrt-queue-dispatch at=([^ ]+) -->/;
            // Only the bot's own footer links a run of THIS repository. The
            // footer text is written by queued-build.yml and issue-build.yml and
            // appears verbatim in the pattern below, where the Chinese literal
            // must stay byte-identical to what the bot posts. A plain
            // "/actions/runs/(\d+)" also matches the links a review comment
            // carries to an OLD build (and to an old issue's run), so it would
            // register that stale run id as this run's approval.
            const runPattern = /\[查看 (?:本次 )?Actions 运行\]\(\S*?\/actions\/runs\/(\d+)\)/;

            // Every label the pipeline can apply, created once per run. The
            // yellow `build-attention` label is among them: a failed or cancelled
            // build is the one state a maintainer has to look at by hand.
            const createdLabels = await ensureAllLabels(github, context);
            if (createdLabels.length) {
              console.log(`Created labels: ${createdLabels.join(', ')}`);
            }

            // Only runs announced on an `approved-build` issue count against the
            // daily slots. A manual `workflow_dispatch` run of build.yml has no
            // issue and no approval marker, so it never enters approvalRuns and
            // never consumes automatic budget -- that is the intended behaviour.
            async function commentsSinceToday(issueNumber) {
              return github.paginate(github.rest.issues.listComments, {
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
                since: todayStart,
                per_page: 100
              });
            }

            const approvedIssues = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'all',
              labels: 'approved-build',
              since: todayStart,
              per_page: 100
            });
            const approvalRuns = new Map();
            const releasedRuns = new Set();
            for (const issue of approvedIssues.filter(item => !item.pull_request)) {
              const comments = await commentsSinceToday(issue.number);
              for (const comment of comments) {
                if (comment.user?.login !== 'github-actions[bot]') continue;
                const approval = (comment.body || '').match(approvalPattern);
                const run = (comment.body || '').match(runPattern);
                if (approval?.[1] === utcDate && run) {
                  approvalRuns.set(Number(run[1]), approval[2]);
                }
              }
            }

            // Slot releases are collected from every open build request, not only
            // from the ones still carrying `approved-build`. A failed or cancelled
            // queued build leaves its issue open on purpose -- the owner has to
            // review it -- and the retry instruction tells the owner to remove
            // `approved-build`, which is exactly the label this scan used to
            // depend on. Filtering by `build-firmware` instead keeps the release
            // marker reachable in every label state the workflow can produce, so
            // a run that never settles (for example a null conclusion) can always
            // be refunded instead of stranding a daily slot forever.
            const releaseSources = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'all',
              labels: 'build-firmware',
              since: todayStart,
              per_page: 100
            });
            // `releaseSources` is the union of both lists: an issue that still
            // carries `approved-build` is exactly where the marker is written --
            // a failed queued build keeps that label on purpose -- so skipping it
            // made the refund unreachable and stranded the daily slot.
            const issueNumbers = new Set(
              [...approvedIssues, ...releaseSources]
                .filter(item => !item.pull_request)
                .map(item => item.number)
            );
            for (const issueNumber of issueNumbers) {
              const comments = await commentsSinceToday(issueNumber);
              for (const comment of comments) {
                if (comment.user?.login !== 'github-actions[bot]') continue;
                const release = (comment.body || '').match(releasePattern);
                if (release) releasedRuns.add(Number(release[1]));
              }
            }

            let successful = 0;
            let active = 0;
            const userOccupied = new Map();
            for (const [runId, requester] of approvalRuns) {
              if (releasedRuns.has(runId)) continue;
              try {
                const run = await github.rest.actions.getWorkflowRun({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  run_id: runId
                });
                if (run.data.conclusion === 'success' || run.data.conclusion === null) {
                  if (run.data.conclusion === 'success') successful++;
                  else active++;
                  userOccupied.set(requester, (userOccupied.get(requester) || 0) + 1);
                }
              } catch (error) {
                if (error.status !== 404) throw error;
              }
            }

            const pending = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'build-review-pending',
              sort: 'created',
              direction: 'asc',
              per_page: 100
            });
            for (const issue of pending.filter(item => !item.pull_request)) {
              await removeLabel(issue.number, 'build-review-pending');
              const requester = issue.user.login;
              if ((userOccupied.get(requester) || 0) >= perUserLimit) {
                await github.rest.issues.addLabels({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issue.number,
                  labels: ['needs-owner-review']
                });
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issue.number,
                  body: `申请者今天已达到自动批准上限（${perUserLimit} 次/UTC 日），本申请转为仓库所有者审核。`
                });
                continue;
              }
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                labels: ['build-queued']
              });
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                body: '参数审核已通过，申请已进入自动构建队列，不占用额度。'
              });
            }

            const dispatching = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'build-dispatching',
              sort: 'created',
              direction: 'asc',
              per_page: 100
            });
            const liveDispatching = [];
            for (const issue of dispatching.filter(item => !item.pull_request)) {
              const comments = await github.paginate(github.rest.issues.listComments, {
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                per_page: 100
              });
              const reservations = comments
                .filter(comment => comment.user?.login === 'github-actions[bot]')
                .map(comment => (comment.body || '').match(dispatchPattern)?.[1])
                .filter(Boolean)
                .sort();
              const reservedAt = reservations.at(-1);
              if (reservedAt && new Date(reservedAt) >= staleBefore) {
                liveDispatching.push(issue);
                continue;
              }
              await removeLabel(issue.number, 'build-dispatching');
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                labels: ['build-queued']
              });
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                body: '之前的队列派发未能开始，Bot 已将此申请放回等待队列。'
              });
            }

            const queued = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'build-queued',
              sort: 'created',
              direction: 'asc',
              per_page: 100
            });
            const queuedIssues = queued.filter(item => !item.pull_request);

            if (successful >= globalLimit && active === 0 && liveDispatching.length === 0) {
              for (const issue of queuedIssues) {
                await removeLabel(issue.number, 'build-queued');
                await github.rest.issues.addLabels({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issue.number,
                  labels: ['needs-owner-review']
                });
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issue.number,
                  body: `今天的 ${globalLimit} 个自动构建额度均已成功完成。本申请已转为仓库所有者审核；所有者确认后可添加 \`approved-build\` 标签。`
                });
              }
              core.info(`Moved ${queuedIssues.length} queued requests to owner review`);
              return;
            }

            const available = Math.max(0, globalLimit - successful - active - liveDispatching.length);
            if (available === 0 || queuedIssues.length === 0) {
              core.info(`No promotion: success=${successful}, active=${active}, dispatching=${liveDispatching.length}, queued=${queuedIssues.length}`);
              return;
            }

            const repository = await github.rest.repos.get({
              owner: context.repo.owner,
              repo: context.repo.repo
            });
            const selected = [];
            const selectionUsers = new Map(userOccupied);
            for (const issue of queuedIssues) {
              const requester = issue.user.login;
              if ((selectionUsers.get(requester) || 0) >= perUserLimit) {
                await removeLabel(issue.number, 'build-queued');
                await github.rest.issues.addLabels({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issue.number,
                  labels: ['needs-owner-review']
                });
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issue.number,
                  body: `申请者今天已达到自动批准上限（${perUserLimit} 次/UTC 日），本申请转为仓库所有者审核。`
                });
                continue;
              }
              if (selected.length >= available) continue;
              selected.push(issue);
              selectionUsers.set(requester, (selectionUsers.get(requester) || 0) + 1);
            }
            if (selected.length === 0) {
              core.info('No queue request is eligible for automatic promotion');
              return;
            }
            for (const issue of selected) {
              await removeLabel(issue.number, 'build-queued');
              await removeLabel(issue.number, 'needs-owner-review');
              // Retrying replaces the failed attempt; the operator has acted, so
              // the yellow marker has done its job.
              await removeLabel(issue.number, 'build-attention');
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                labels: ['build-dispatching']
              });
              const reservedAt = new Date().toISOString();
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                body: `<!-- fanchmwrt-queue-dispatch at=${reservedAt} -->\n已有自动构建名额释放，Bot 正在按队列顺序启动此申请。`
              });
              try {
                await github.rest.actions.createWorkflowDispatch({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  workflow_id: 'queued-build.yml',
                  ref: repository.data.default_branch,
                  inputs: { issue_number: String(issue.number) }
                });
              } catch (error) {
                await removeLabel(issue.number, 'build-dispatching');
                await github.rest.issues.addLabels({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issue.number,
                  labels: ['build-queued']
                });
                throw error;
              }
            }
            core.info(`Dispatched ${selected.length} queued requests`);
