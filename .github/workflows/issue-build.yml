name: Build Firmware From Issue

on:
  issues:
    types:
      - labeled

permissions:
  contents: read
  issues: write

jobs:
  parse:
    name: Validate approved build request
    if: >-
      github.event.issue.state == 'open' &&
      github.event.label.name == 'approved-build' &&
      github.event.sender.login == github.repository_owner &&
      contains(github.event.issue.labels.*.name, 'build-firmware')
    runs-on: ubuntu-22.04
    outputs:
      upstream_ref: ${{ steps.upstream.outputs.result }}
      architecture: ${{ steps.request.outputs.architecture }}
      target: ${{ steps.request.outputs.target }}
      subtarget: ${{ steps.request.outputs.subtarget }}
      profile: ${{ steps.request.outputs.profile }}
    steps:
      - name: Checkout builder
        uses: actions/checkout@v4

      - name: Parse and validate issue form
        id: request
        env:
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: python3 scripts/parse-build-issue.py

      - name: Resolve upstream ref
        id: upstream
        uses: actions/github-script@v7
        env:
          UPSTREAM_REF: ${{ steps.request.outputs.upstream_ref }}
        with:
          result-encoding: string
          script: |
            const commit = await github.rest.repos.getCommit({
              owner: 'fanchmwrt',
              repo: 'fanchmwrt',
              ref: process.env.UPSTREAM_REF
            });
            return commit.data.sha;

      - name: Checkout upstream target metadata
        uses: actions/checkout@v4
        with:
          repository: fanchmwrt/fanchmwrt
          ref: ${{ steps.upstream.outputs.result }}
          path: target-source
          fetch-depth: 1

      - name: Validate OpenWrt target and device profile
        env:
          TARGET: ${{ steps.request.outputs.target }}
          SUBTARGET: ${{ steps.request.outputs.subtarget }}
          PROFILE: ${{ steps.request.outputs.profile }}
          ARCHITECTURE: ${{ steps.request.outputs.architecture }}
        run: ./scripts/validate-openwrt-target.sh target-source "$TARGET" "$SUBTARGET" "$PROFILE" "$ARCHITECTURE"

      - name: Report accepted request
        uses: actions/github-script@v7
        env:
          UPSTREAM_REF: ${{ steps.request.outputs.upstream_ref }}
          UPSTREAM_COMMIT: ${{ steps.upstream.outputs.result }}
          ARCHITECTURE: ${{ steps.request.outputs.architecture }}
          TARGET: ${{ steps.request.outputs.target }}
          SUBTARGET: ${{ steps.request.outputs.subtarget }}
          PROFILE: ${{ steps.request.outputs.profile }}
        with:
          script: |
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = [
              '仓库所有者已批准此请求，参数校验通过并开始编译。',
              '',
              `- 上游版本：\`${process.env.UPSTREAM_REF}\``,
              `- 上游提交：\`${process.env.UPSTREAM_COMMIT}\``,
              `- 架构：\`${process.env.ARCHITECTURE}\``,
              `- 目标：\`${process.env.TARGET}/${process.env.SUBTARGET}/${process.env.PROFILE}\``,
              `- [查看 Actions 运行](${runUrl})`
            ].join('\n');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body
            });

  build:
    name: Build requested firmware
    needs: parse
    uses: ./.github/workflows/build.yml
    with:
      upstream_ref: ${{ needs.parse.outputs.upstream_ref }}
      architecture: ${{ needs.parse.outputs.architecture }}
      target: ${{ needs.parse.outputs.target }}
      subtarget: ${{ needs.parse.outputs.subtarget }}
      profile: ${{ needs.parse.outputs.profile }}

  report:
    name: Report final status
    needs:
      - parse
      - build
    if: >-
      always() &&
      github.event.issue.state == 'open' &&
      github.event.label.name == 'approved-build' &&
      github.event.sender.login == github.repository_owner &&
      contains(github.event.issue.labels.*.name, 'build-firmware')
    runs-on: ubuntu-22.04
    steps:
      - name: Comment on issue
        uses: actions/github-script@v7
        env:
          PARSE_RESULT: ${{ needs.parse.result }}
          BUILD_RESULT: ${{ needs.build.result }}
          UPSTREAM_COMMIT: ${{ needs.build.outputs.upstream_commit }}
          ARCHITECTURE: ${{ needs.parse.outputs.architecture }}
          TARGET: ${{ needs.parse.outputs.target }}
          SUBTARGET: ${{ needs.parse.outputs.subtarget }}
          PROFILE: ${{ needs.parse.outputs.profile }}
        with:
          script: |
            const crypto = require('crypto');
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            let summary;
            let marker = '';
            if (process.env.PARSE_RESULT !== 'success') {
              summary = '构建请求参数校验失败，未触发编译。请修正模板字段；重试时由仓库所有者移除后重新添加 `approved-build` 标签。';
            } else if (process.env.BUILD_RESULT === 'success') {
              summary = '固件构建成功，产物可从本次 Actions 运行中下载。';
              const identity = [
                process.env.UPSTREAM_COMMIT,
                process.env.ARCHITECTURE,
                process.env.TARGET,
                process.env.SUBTARGET,
                process.env.PROFILE
              ].join('\n');
              const fingerprint = crypto.createHash('sha256').update(identity).digest('hex');
              marker = `<!-- fanchmwrt-build fingerprint=${fingerprint} -->\n`;
            } else if (process.env.BUILD_RESULT === 'cancelled') {
              summary = '固件构建已取消。';
            } else {
              summary = '固件构建失败，请查看 Actions 日志。';
            }
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `${marker}${summary}\n\n[查看 Actions 运行](${runUrl})`
            });
            if (process.env.BUILD_RESULT === 'success') {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                state: 'closed',
                state_reason: 'completed'
              });
            }
