name: Build FanchmWrt Firmware

on:
  workflow_dispatch:
    inputs:
      upstream_ref:
        description: Version to build, newest first; fanchmwrt-* entries build the branch head and carry the private fanchmwrt layer, v* entries are the released upstream tree
        required: true
        type: choice
        options:
          # BEGIN upstream_ref options (auto-generated by .github/workflows/sync-upstream-refs.yml)
          - fanchmwrt-25.12.6
          - v25.12.6
          - v25.12.5
          - fanchmwrt-25.12.4
          - v25.12.4
          - v25.12.3
          - fanchmwrt-25.12.2
          - v25.12.2
          - v25.12.1
          - v25.12.0
          - fanchmwrt-24.10.4
          - v24.10.4
          - v24.10.3
          - v24.10.2
          - v24.10.1
          - v24.10.0
          # END upstream_ref options (auto-generated by .github/workflows/sync-upstream-refs.yml)
        # BEGIN upstream_ref default (auto-generated by .github/workflows/sync-upstream-refs.yml)
        default: fanchmwrt-25.12.6
        # END upstream_ref default (auto-generated by .github/workflows/sync-upstream-refs.yml)
      upstream_ref_override:
        description: Optional branch, tag, or full commit SHA that replaces the selection above
        required: false
        type: string
      architecture:
        description: Package architecture family
        required: true
        default: mipsel
        type: choice
        options:
          - mipsel
          - arm
          - x86
      target:
        description: OpenWrt target, for example ramips, rockchip, or x86
        required: true
        default: ramips
        type: string
      subtarget:
        description: OpenWrt subtarget, for example mt7621, armv8, or 64
        required: true
        default: mt7621
        type: string
      profile:
        description: OpenWrt device profile, for example xiaoyu_xy-c5 or generic
        required: true
        default: xiaoyu_xy-c5
        type: string
  workflow_call:
    inputs:
      upstream_ref:
        description: Upstream branch, tag, or full commit SHA
        required: true
        type: string
      upstream_ref_name:
        description: Release the caller selected, so the device backport ref can be derived when upstream_ref is a commit
        required: false
        type: string
        default: ''
      upstream_ref_override:
        description: Commit the caller pinned, which also decides the device backport ref
        required: false
        type: string
        default: ''
      architecture:
        description: Package architecture family
        required: true
        type: string
      target:
        description: OpenWrt target
        required: true
        type: string
      subtarget:
        description: OpenWrt subtarget
        required: true
        type: string
      profile:
        description: OpenWrt device profile
        required: true
        type: string
    outputs:
      upstream_commit:
        description: Exact upstream commit used for the build
        value: ${{ jobs.build.outputs.upstream_commit }}

permissions:
  contents: read

concurrency:
  group: fanchmwrt-${{ inputs.target }}-${{ inputs.subtarget }}-${{ inputs.profile }}-${{ inputs.upstream_ref_override || inputs.upstream_ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ inputs.target }}/${{ inputs.subtarget }}/${{ inputs.profile }}
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    outputs:
      upstream_commit: ${{ steps.upstream.outputs.sha }}

    steps:
      - name: Checkout builder
        uses: actions/checkout@v5

      - name: Checkout upstream FanchmWrt
        uses: actions/checkout@v5
        with:
          repository: fanchmwrt/fanchmwrt
          ref: ${{ inputs.upstream_ref_override || inputs.upstream_ref }}
          path: source
          # Full history: the device backport series is pinned to one released
          # tag and also runs on the maintenance branch built on top of it, so
          # scripts/apply.sh has to prove the requested ref descends from that
          # tag. A shallow clone cannot answer that and would reject a branch
          # build that is actually fine.
          fetch-depth: 0

      - name: Record upstream commit
        id: upstream
        run: |
          sha="$(git -C source rev-parse HEAD)"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "$sha"

      - name: Apply local upgrade and source customizations
        run: ./scripts/prepare-source.sh source

      # The release name is what the backport repository keeps its branches under.
      # `fanchmwrt-25.12.6` is a builder-side ref that has no counterpart there, so
      # the tag is derived from it.
      #
      # A workflow_call carries the resolved commit in `upstream_ref` -- a SHA says
      # nothing about which release the device backports belong to, and asking for
      # it by SHA silently falls back to the default branch, which carries the
      # newest series. The caller therefore also passes the release it selected in
      # `upstream_ref_name`.
      #
      # The candidates are tried in this order, and scripts/backport-ref.sh owns
      # the rule so the review stages apply the patch set this build will:
      #   1. DEVICE_BACKPORT_REF (an owner pins the branch)
      #   2. upstream_ref_override -- an explicit "build this commit" request has to
      #      decide the patch set too, otherwise the documented escape hatch of
      #      pinning a baseline commit is defeated by the dropdown next to it
      #   3. upstream_ref_name -- the release a caller selected
      #   4. the dispatch dropdown
      # An empty result lets resolve-device-profile.sh discover the default branch
      # before manifest.json validates it.
      - name: Derive device backport ref
        id: backport-ref
        env:
          EVENT_NAME: ${{ github.event_name }}
          REQUESTED_REF: ${{ vars.DEVICE_BACKPORT_REF }}
          SELECTED_NAME: ${{ inputs.upstream_ref_name }}
          PINNED_REF: ${{ inputs.upstream_ref_override }}
          SELECTED_REF: ${{ inputs.upstream_ref }}
        run: |
          set -euo pipefail
          # On workflow_call, upstream_ref holds the resolved commit, which no
          # repository has a branch for: passing it as a candidate would only buy a
          # failed fetch before the default branch. Without a release name or an
          # override, ask for nothing and let the resolver discover that branch.
          if [[ "${EVENT_NAME}" == "workflow_call" ]]; then
            fallback=""
          else
            fallback="${SELECTED_REF:-}"
          fi
          ref="$(bash ./scripts/backport-ref.sh \
            "${REQUESTED_REF:-}" "${PINNED_REF:-}" "${SELECTED_NAME:-}" "$fallback")"
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
          echo "Device backport ref: ${ref:-<default branch>}"

      - name: Resolve FanchmWrt device profile
        env:
          TARGET: ${{ inputs.target }}
          SUBTARGET: ${{ inputs.subtarget }}
          PROFILE: ${{ inputs.profile }}
          ARCHITECTURE: ${{ inputs.architecture }}
          UPSTREAM_REF: ${{ inputs.upstream_ref }}
          DEVICE_BACKPORT_REPOSITORY: ${{ vars.DEVICE_BACKPORT_REPOSITORY || 'nd002723/fanchmwrt-device-backports' }}
          # Backport branches are named after the release tag, never after the
          # maintenance branch: `fanchmwrt-25.12.6` is a builder-side ref that the
          # backport repository knows nothing about. Forcing the builder ref here
          # made every default build fetch the default branch and fail the
          # manifest check, so the ref is derived above instead.
          DEVICE_BACKPORT_REF: ${{ steps.backport-ref.outputs.ref }}
        run: |
          set +e
          bash ./scripts/resolve-device-profile.sh \
            source "$TARGET" "$SUBTARGET" "$PROFILE" "$ARCHITECTURE"
          status=$?
          set -e
          case "$status" in
            0) ;;
            # Stage 3 of the resolution chain: neither FanchmWrt nor the backport
            # set provides this device. The compile was going to fail anyway, so
            # stop here with the resolution report as the annotation instead of a
            # compiler error. This is the same outcome the review stage reports as
            # an unknown device.
            21)
              echo "::error title=Device not found::${TARGET}/${SUBTARGET}/${PROFILE} is not provided by ${UPSTREAM_REF} nor by the device backport set. See the step log for the full resolution report."
              exit 21
              ;;
            # A malformed request or an architecture mismatch: also not a compile
            # problem, and no patch series can repair it.
            2|13)
              echo "::error title=Invalid device request::${TARGET}/${SUBTARGET}/${PROFILE} was rejected with status $status before compiling. See the step log."
              exit "$status"
              ;;
            *)
              echo "::error title=Device resolution failed::resolving ${TARGET}/${SUBTARGET}/${PROFILE} failed with status $status. See the step log."
              exit "$status"
              ;;
          esac

      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          df -h

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential clang flex bison g++ gawk gcc-multilib g++-multilib \
            gettext git libelf-dev libncurses-dev libssl-dev python3 python3-pyelftools \
            python3-setuptools rsync swig unzip zlib1g-dev file wget time xsltproc zstd

      - name: Cache downloads
        uses: actions/cache@v4
        with:
          path: source/dl
          key: fanchmwrt-dl-${{ runner.os }}-${{ hashFiles('source/feeds.conf.default', 'configs/base.config') }}
          restore-keys: |
            fanchmwrt-dl-${{ runner.os }}-

      - name: Update and install feeds
        working-directory: source
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Configure requested OpenWrt profile
        env:
          TARGET: ${{ inputs.target }}
          SUBTARGET: ${{ inputs.subtarget }}
          PROFILE: ${{ inputs.profile }}
          ARCHITECTURE: ${{ inputs.architecture }}
        run: ./scripts/configure.sh source configs/base.config "$TARGET" "$SUBTARGET" "$PROFILE" "$ARCHITECTURE"

      - name: Download source packages
        working-directory: source
        run: make download -j"$(nproc)" V=s

      - name: Compile firmware
        working-directory: source
        run: make -j"$(nproc)" BUILD_LOG=1 || make -j1 V=s BUILD_LOG=1

      - name: Verify firmware contents
        run: ./scripts/verify-build.sh source

      - name: Collect firmware artifacts
        run: ./scripts/collect-artifacts.sh source artifacts

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          # The device part is stable so a download link stays readable; the run
          # id keeps two builds of the same device (a forced rebuild) from
          # colliding inside one workflow call.
          name: fanchmwrt-${{ inputs.target }}-${{ inputs.subtarget }}-${{ inputs.profile }}-${{ github.run_id }}
          path: artifacts/
          if-no-files-found: error

      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          # Unique per build: two requests for the same upstream ref run this
          # workflow concurrently (issue-build.yml and queued-build.yml both
          # call it), and a fixed name makes the second upload fight the first.
          name: fanchmwrt-build-logs-${{ inputs.target }}-${{ inputs.subtarget }}-${{ inputs.profile }}-${{ github.run_id }}
          path: source/logs/
          if-no-files-found: ignore
