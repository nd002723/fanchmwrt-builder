name: Build Queued Firmware Request

on:
  workflow_dispatch:
    inputs:
      issue_number:
        description: Queued firmware request issue number
        required: true
        type: string

permissions:
  actions: write
  contents: read
  issues: write

concurrency:
  group: queued-firmware-issue-${{ inputs.issue_number }}
  cancel-in-progress: false

jobs:
  parse:
    name: Revalidate queued request
    runs-on: ubuntu-22.04
    outputs:
      upstream_ref: ${{ steps.request.outputs.upstream_ref }}
      upstream_selection: ${{ steps.request.outputs.upstream_selection }}
      upstream_override: ${{ steps.request.outputs.upstream_override }}
      upstream_commit: ${{ steps.upstream.outputs.result }}
      architecture: ${{ steps.request.outputs.architecture }}
      target: ${{ steps.request.outputs.target }}
      subtarget: ${{ steps.request.outputs.subtarget }}
      profile: ${{ steps.request.outputs.profile }}
      requester: ${{ steps.issue.outputs.requester }}
    steps:
      - name: Checkout builder
        uses: actions/checkout@v5

      - name: Load queued issue
        id: issue
        uses: actions/github-script@v8
        env:
          ISSUE_NUMBER: ${{ inputs.issue_number }}
        with:
          script: |
            const issueNumber = Number.parseInt(process.env.ISSUE_NUMBER, 10);
            if (!Number.isInteger(issueNumber) || issueNumber <= 0) {
              core.setFailed('Invalid queued issue number');
              return;
            }
            const response = await github.rest.issues.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber
            });
            const labels = response.data.labels.map(label =>
              typeof label === 'string' ? label : label.name
            );
            core.setOutput('title', response.data.title || '');
            core.setOutput('body', response.data.body || '');
            core.setOutput('requester', response.data.user.login);
            if (response.data.state !== 'open' || !labels.includes('build-firmware')) {
              core.setFailed('Issue is not an open firmware build request');
              return;
            }

            // `build-dispatching` is the queue controller's reservation. Only the
            // controller sets it, and promotion removes it before dispatching, so
            // the label is back on the issue only when the controller's reservation
            // comment and this run belong together. An owner labelling the issue
            // by hand never produces that combination, which keeps the two intake
            // paths apart without guessing from the sender.
            if (!labels.includes('build-dispatching')) {
              const comments = await github.paginate(github.rest.issues.listComments, {
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
                per_page: 100
              });
              const reserved = comments.some(comment =>
                comment.user?.login === 'github-actions[bot]' &&
                /<!-- fanchmwrt-queue-dispatch at=[^ ]+ -->/.test(comment.body || '')
              );
              if (!reserved) {
                core.setFailed('Issue is not an active dispatched firmware request');
                return;
              }
              core.notice('Revalidating a dispatched request whose reservation label was removed.');
            }

      - name: Parse build request
        id: request
        env:
          ISSUE_TITLE: ${{ steps.issue.outputs.title }}
          ISSUE_BODY: ${{ steps.issue.outputs.body }}
        run: python3 scripts/parse-build-issue.py

      - name: Resolve upstream ref
        id: upstream
        uses: actions/github-script@v8
        env:
          UPSTREAM_REF: ${{ steps.request.outputs.upstream_ref }}
        with:
          result-encoding: string
          script: |
            const commit = await github.rest.repos.getCommit({
              owner: 'fanchmwrt',
              repo: 'fanchmwrt',
              ref: process.env.UPSTREAM_REF
            });
            return commit.data.sha;

      - name: Checkout upstream target metadata
        uses: actions/checkout@v5
        with:
          repository: fanchmwrt/fanchmwrt
          ref: ${{ steps.upstream.outputs.result }}
          path: target-source
          fetch-depth: 1

      - name: Resolve FanchmWrt device profile
        id: target
        env:
          TARGET: ${{ steps.request.outputs.target }}
          SUBTARGET: ${{ steps.request.outputs.subtarget }}
          PROFILE: ${{ steps.request.outputs.profile }}
          ARCHITECTURE: ${{ steps.request.outputs.architecture }}
          DEVICE_BACKPORT_REPOSITORY: ${{ vars.DEVICE_BACKPORT_REPOSITORY || 'nd002723/fanchmwrt-device-backports' }}
          DEVICE_BACKPORT_REF: ${{ vars.DEVICE_BACKPORT_REF }}
          DEVICE_BACKPORT_SELECTION: ${{ steps.request.outputs.upstream_selection }}
          DEVICE_BACKPORT_OVERRIDE: ${{ steps.request.outputs.upstream_override }}
        run: |
          set -euo pipefail
          # Same candidates as the build, in the same order (scripts/backport-ref.sh
          # owns the rule): the pinned branch, an explicit override, then the release
          # the requester selected. A review that picks a different series than the
          # build applies rejects devices that would have built.
          backport_ref="$(bash ./scripts/backport-ref.sh "${DEVICE_BACKPORT_REF:-}" \
            "${DEVICE_BACKPORT_OVERRIDE:-}" "${DEVICE_BACKPORT_SELECTION:-}")"
          echo "Device backport ref: ${backport_ref:-<default branch>}"
          DEVICE_BACKPORT_REF="$backport_ref" bash ./scripts/resolve-device-profile.sh \
            target-source "$TARGET" "$SUBTARGET" "$PROFILE" "$ARCHITECTURE"

      - name: Mark queue request approved
        uses: actions/github-script@v8
        env:
          ISSUE_NUMBER: ${{ inputs.issue_number }}
          REQUESTER: ${{ steps.issue.outputs.requester }}
          UPSTREAM_REF: ${{ steps.request.outputs.upstream_ref }}
          UPSTREAM_SHA: ${{ steps.upstream.outputs.result }}
          ARCHITECTURE: ${{ steps.request.outputs.architecture }}
          TARGET: ${{ steps.request.outputs.target }}
          SUBTARGET: ${{ steps.request.outputs.subtarget }}
          PROFILE: ${{ steps.request.outputs.profile }}
        with:
          script: |
            const issueNumber = Number(process.env.ISSUE_NUMBER);
            const current = await github.rest.issues.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber
            });
            const currentLabels = current.data.labels.map(label =>
              typeof label === 'string' ? label : label.name
            );
            if (current.data.state !== 'open' || !currentLabels.includes('build-firmware')) {
              core.setFailed('Issue is no longer an open firmware build request');
              return;
            }
            async function removeLabel(name) {
              try {
                await github.rest.issues.removeLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issueNumber,
                  name
                });
              } catch (error) {
                if (error.status !== 404) throw error;
              }
            }
            await removeLabel('build-queued');
            await removeLabel('needs-owner-review');
            await removeLabel('build-review-pending');
            await removeLabel('build-attention');
            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              labels: ['approved-build']
            });
            const utcDate = new Date().toISOString().slice(0, 10);
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = [
              `<!-- fanchmwrt-auto-approved date=${utcDate} requester=${process.env.REQUESTER} -->`,
              '等待队列已有名额释放，Bot 已重新校验参数并开始编译。',
              '',
              `- 申请者：@${process.env.REQUESTER}`,
              `- 上游版本：\`${process.env.UPSTREAM_REF}\``,
              `- 上游提交：\`${process.env.UPSTREAM_SHA}\``,
              `- 架构：\`${process.env.ARCHITECTURE}\``,
              `- 目标：\`${process.env.TARGET}/${process.env.SUBTARGET}/${process.env.PROFILE}\``,
              `- [查看 Actions 运行](${runUrl})`
            ].join('\n');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              body
            });
            // Drop the reservation last: the label plus the dispatch comment are
            // what a concurrent run uses to prove it belongs to this dispatch, so
            // removing it first would let a late duplicate fail the revalidation.
            await removeLabel('build-dispatching');
            await removeLabel('build-attention');

  build:
    name: Build promoted queued firmware
    needs: parse
    uses: ./.github/workflows/build.yml
    with:
      upstream_ref: ${{ needs.parse.outputs.upstream_commit }}
      # The build has to apply the same patch set the revalidation just accepted,
      # and a commit SHA cannot name a backport branch.
      upstream_ref_name: ${{ needs.parse.outputs.upstream_selection }}
      upstream_ref_override: ${{ needs.parse.outputs.upstream_override }}
      architecture: ${{ needs.parse.outputs.architecture }}
      target: ${{ needs.parse.outputs.target }}
      subtarget: ${{ needs.parse.outputs.subtarget }}
      profile: ${{ needs.parse.outputs.profile }}

  report:
    name: Report queued build result
    needs:
      - parse
      - build
    if: always()
    runs-on: ubuntu-22.04
    steps:
      # scripts/lib/labels.js is required below; a require resolves against the
      # workspace, so the job needs the checkout even though it only talks to the
      # API.
      - name: Checkout builder
        uses: actions/checkout@v5

      - name: Update issue and queue
        uses: actions/github-script@v8
        env:
          ISSUE_NUMBER: ${{ inputs.issue_number }}
          PARSE_RESULT: ${{ needs.parse.result }}
          BUILD_RESULT: ${{ needs.build.result }}
          UPSTREAM_COMMIT: ${{ needs.build.outputs.upstream_commit }}
          ARCHITECTURE: ${{ needs.parse.outputs.architecture }}
          TARGET: ${{ needs.parse.outputs.target }}
          SUBTARGET: ${{ needs.parse.outputs.subtarget }}
          PROFILE: ${{ needs.parse.outputs.profile }}
        with:
          script: |
            const crypto = require('crypto');
            const issueNumber = Number.parseInt(process.env.ISSUE_NUMBER, 10);
            if (!Number.isInteger(issueNumber) || issueNumber <= 0) {
              core.setFailed('Invalid queued issue number');
              return;
            }
            async function removeLabel(name) {
              try {
                await github.rest.issues.removeLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issueNumber,
                  name
                });
              } catch (error) {
                if (error.status !== 404) throw error;
              }
            }
            // Colours and descriptions are not repeated here: the shared table in
            // scripts/lib/labels.js owns them, so a colour changed for one workflow
            // cannot leave a stale one behind in another.
            const { ensureLabel } = require('./scripts/lib/labels.js');

            // The proof that this run belongs to a queue dispatch is re-read from
            // the issue instead of being taken from the parse job: a failed job
            // hands none of its outputs to its dependents, so a carried-label
            // snapshot produced there is always empty exactly when it matters.
            const dispatchPattern = /<!-- fanchmwrt-queue-dispatch at=[^ ]+ -->/;
            async function currentLabels() {
              const current = await github.rest.issues.get({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber
              });
              return current.data.labels.map(label =>
                typeof label === 'string' ? label : label.name
              );
            }
            async function wasDispatchedFromQueue() {
              if ((await currentLabels()).includes('build-dispatching')) return true;
              const comments = await github.paginate(github.rest.issues.listComments, {
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
                per_page: 100
              });
              return comments.some(comment =>
                comment.user?.login === 'github-actions[bot]' &&
                dispatchPattern.test(comment.body || '')
              );
            }

            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const parseSucceeded = process.env.PARSE_RESULT === 'success';

            // Give a failed request back to the owner and decide whether that is
            // already true. The controller may have moved the issue on while this
            // run was failing -- most often because the slot reservation went stale
            // and was re-queued -- so the current labels, not the ones this run
            // started with, decide whether the hand-over comment still applies.
            async function dispatchNeedsOwnerReview(reason) {
              await removeLabel('build-dispatching');
              await removeLabel('build-queued');
              await removeLabel('approved-build');
              await ensureLabel(github, context, 'needs-owner-review');
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
                labels: ['needs-owner-review']
              });
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
                body: [
                  `<!-- fanchmwrt-build refused reason=${reason} run=${context.runId} -->`,
                  '队列申请重新校验失败，已转为仓库所有者审核。'
                ].join('\n')
              });
              const current = await github.rest.issues.get({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber
              });
              const labels = current.data.labels.map(label =>
                typeof label === 'string' ? label : label.name
              );
              return !labels.includes('needs-owner-review') ||
                labels.includes('build-queued') ||
                labels.includes('build-dispatching') ||
                labels.includes('approved-build');
            }

            // Wake the controller so a refunded slot is spent now instead of at the
            // next scheduled reconciliation.
            async function dispatchQueueController() {
              try {
                const repository = await github.rest.repos.get({
                  owner: context.repo.owner,
                  repo: context.repo.repo
                });
                await github.rest.actions.createWorkflowDispatch({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  workflow_id: 'queue-controller.yml',
                  ref: repository.data.default_branch
                });
              } catch (error) {
                core.warning(`Queue controller dispatch failed; scheduled reconciliation will retry: ${error.message}`);
              }
            }

            if (!parseSucceeded) {
              // Two different things end up here. A dispatched request that fails
              // revalidation goes back to the owner. A request the owner approved
              // by hand was never queued at all, so its labels and its issue are
              // none of this workflow's business -- touching them would strip an
              // approval that issue-build.yml is using right now.
              const dispatched = await wasDispatchedFromQueue();
              let ownerTookOver = !dispatched;
              if (dispatched) {
                ownerTookOver = await dispatchNeedsOwnerReview('queue_revalidation');
              }
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
                body: ownerTookOver
                  ? `队列派发已停止，此申请已经由仓库所有者接管。\n\n[查看 Actions 运行](${runUrl})`
                  : `队列申请重新校验失败，已转为仓库所有者审核（详见上一条评论）。\n\n[查看 Actions 运行](${runUrl})`
              });
              return;
            }

            let summary;
            let marker = '';
            if (process.env.BUILD_RESULT === 'success') {
              summary = '队列中的固件构建成功，产物可从本次 Actions 运行中下载。';
              const identity = [
                process.env.UPSTREAM_COMMIT,
                process.env.ARCHITECTURE,
                process.env.TARGET,
                process.env.SUBTARGET,
                process.env.PROFILE
              ].join('\n');
              const fingerprint = crypto.createHash('sha256').update(identity).digest('hex');
              marker = `<!-- fanchmwrt-build fingerprint=${fingerprint} -->\n`;
              await removeLabel('build-attention');
            } else if (process.env.BUILD_RESULT === 'cancelled') {
              marker = `<!-- fanchmwrt-auto-slot-released run=${context.runId} -->\n`;
              summary = '队列中的固件构建已取消，自动构建额度已经释放，申请已标记为待审。';
              await ensureLabel(github, context, 'build-attention');
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
                labels: ['build-attention']
              });
            } else {
              marker = `<!-- fanchmwrt-auto-slot-released run=${context.runId} -->\n`;
              summary = '队列中的固件构建失败，自动构建额度已经释放，申请已标记为待审。';
              await ensureLabel(github, context, 'build-attention');
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
                labels: ['build-attention']
              });
            }
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              body: `${marker}${summary}\n\n[查看 Actions 运行](${runUrl})`
            });
            // A failed or cancelled build leaves the issue open on purpose: the
            // owner has to review it, and closing it would erase the place where
            // that review happens.
            if (process.env.BUILD_RESULT === 'success') {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
                state: 'closed',
                state_reason: 'completed'
              });
            }

            // A successful build leaves nothing for the controller to refund, and
            // every dispatch it receives is itself an approval-comment-bearing
            // run -- the controller counts those runs per requester. Dispatching
            // here on success would therefore inflate that count and could push
            // the same requester over the per-user limit for their next request.
            if (process.env.BUILD_RESULT !== 'success') {
              await dispatchQueueController();
            }
