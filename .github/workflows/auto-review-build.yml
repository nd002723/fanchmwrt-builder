name: Auto-review Firmware Build Request
run-name: Review firmware request #${{ github.event.issue.number }} by @${{ github.actor }}

on:
  issues:
    types:
      - opened
      - reopened

permissions:
  actions: write
  contents: read
  issues: write

jobs:
  review:
    name: Validate and rate-limit request
    if: >-
      github.event.issue.state == 'open' &&
      contains(github.event.issue.labels.*.name, 'build-firmware') &&
      !contains(github.event.issue.labels.*.name, 'approved-build') &&
      !contains(github.event.issue.labels.*.name, 'build-review-pending') &&
      !contains(github.event.issue.labels.*.name, 'build-queued') &&
      !contains(github.event.issue.labels.*.name, 'build-dispatching') &&
      !contains(github.event.issue.labels.*.name, 'needs-owner-review')
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout builder
        uses: actions/checkout@v4

      - name: Parse build request
        id: request
        continue-on-error: true
        env:
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: python3 scripts/parse-build-issue.py

      - name: Report invalid request
        if: steps.request.outcome != 'success'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: '自动审核未通过：构建参数无效或模板结构已被修改。请使用 `Firmware build` 模板重新提交；仓库所有者也不应批准未经校验的参数。'
            });

      - name: Resolve upstream ref
        id: upstream
        if: steps.request.outcome == 'success'
        continue-on-error: true
        uses: actions/github-script@v7
        env:
          UPSTREAM_REF: ${{ steps.request.outputs.upstream_ref }}
        with:
          result-encoding: string
          script: |
            const commit = await github.rest.repos.getCommit({
              owner: 'fanchmwrt',
              repo: 'fanchmwrt',
              ref: process.env.UPSTREAM_REF
            });
            return commit.data.sha;

      - name: Report invalid upstream ref
        if: steps.request.outcome == 'success' && steps.upstream.outcome != 'success'
        uses: actions/github-script@v7
        env:
          UPSTREAM_REF: ${{ steps.request.outputs.upstream_ref }}
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `自动审核未通过：上游 \`${process.env.UPSTREAM_REF}\` 不存在或无法解析。本次申请不进入构建计数。`
            });

      - name: Checkout upstream target metadata
        if: steps.upstream.outcome == 'success'
        uses: actions/checkout@v4
        with:
          repository: fanchmwrt/fanchmwrt
          ref: ${{ steps.upstream.outputs.result }}
          path: target-source
          fetch-depth: 1

      - name: Resolve FanchmWrt device profile
        id: target
        if: steps.upstream.outcome == 'success'
        continue-on-error: true
        env:
          TARGET: ${{ steps.request.outputs.target }}
          SUBTARGET: ${{ steps.request.outputs.subtarget }}
          PROFILE: ${{ steps.request.outputs.profile }}
          ARCHITECTURE: ${{ steps.request.outputs.architecture }}
          DEVICE_BACKPORT_REPOSITORY: ${{ vars.DEVICE_BACKPORT_REPOSITORY || 'nd002723/fanchmwrt-device-backports' }}
          DEVICE_BACKPORT_REF: ${{ vars.DEVICE_BACKPORT_REF || 'main' }}
        run: bash ./scripts/resolve-device-profile.sh target-source "$TARGET" "$SUBTARGET" "$PROFILE" "$ARCHITECTURE"

      - name: Report invalid OpenWrt target
        if: steps.target.outcome != 'success' && steps.target.outcome != 'skipped'
        uses: actions/github-script@v7
        env:
          TARGET: ${{ steps.request.outputs.target }}
          SUBTARGET: ${{ steps.request.outputs.subtarget }}
          PROFILE: ${{ steps.request.outputs.profile }}
          ARCHITECTURE: ${{ steps.request.outputs.architecture }}
        with:
          script: |
            const requested = `${process.env.TARGET}/${process.env.SUBTARGET}/${process.env.PROFILE}`;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `自动审核未通过：上游 OpenWrt 不识别目标 \`${requested}\`，或它与架构 \`${process.env.ARCHITECTURE}\` 不匹配。本次申请不会进入正式编译，也不计入每日额度。`
            });

      - name: Check duplicates and enqueue review
        id: review
        if: steps.target.outcome == 'success'
        uses: actions/github-script@v7
        env:
          UPSTREAM_REF: ${{ steps.request.outputs.upstream_ref }}
          UPSTREAM_SHA: ${{ steps.upstream.outputs.result }}
          ARCHITECTURE: ${{ steps.request.outputs.architecture }}
          TARGET: ${{ steps.request.outputs.target }}
          SUBTARGET: ${{ steps.request.outputs.subtarget }}
          PROFILE: ${{ steps.request.outputs.profile }}
        with:
          result-encoding: string
          script: |
            const crypto = require('crypto');

            async function ensureLabel(name, color, description) {
              try {
                await github.rest.issues.getLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  name
                });
              } catch (error) {
                if (error.status !== 404) throw error;
                try {
                  await github.rest.issues.createLabel({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    name,
                    color,
                    description
                  });
                } catch (createError) {
                  if (createError.status !== 422) throw createError;
                }
              }
            }

            const upstreamSha = process.env.UPSTREAM_SHA;
            const identity = [
              upstreamSha,
              process.env.ARCHITECTURE,
              process.env.TARGET,
              process.env.SUBTARGET,
              process.env.PROFILE
            ].join('\n');
            const fingerprint = crypto.createHash('sha256').update(identity).digest('hex');
            const now = new Date();
            const reuseCutoff = new Date(now.getTime() - 30 * 24 * 60 * 60 * 1000).toISOString();
            const approvedIssues = await github.paginate(
              github.rest.issues.listForRepo,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                state: 'all',
                labels: 'approved-build',
                sort: 'updated',
                direction: 'desc',
                per_page: 100
              },
              (response, done) => {
                const recent = response.data.filter(issue =>
                  !issue.pull_request && issue.updated_at >= reuseCutoff
                );
                if (response.data.some(issue => issue.updated_at < reuseCutoff)) done();
                return recent;
              }
            );

            const commentGroups = await Promise.all(approvedIssues.map(async issue => ({
              issue,
              comments: await github.paginate(github.rest.issues.listComments, {
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                per_page: 100
              })
            })));
            const botComments = commentGroups.flatMap(group =>
              group.comments
                .filter(comment =>
                  comment.user?.login === 'github-actions[bot]' &&
                  comment.created_at >= reuseCutoff
                )
                .map(comment => ({ ...comment, issue_number: group.issue.number }))
            );

            const fingerprintPattern = /<!-- fanchmwrt-build fingerprint=([a-f0-9]{64}) -->/;
            const runPattern = /\/actions\/runs\/(\d+)/;
            const fingerprintedRuns = new Set();
            for (const comment of botComments) {
              const body = comment.body || '';
              const runMatch = body.match(runPattern);
              if (runMatch && fingerprintPattern.test(body)) fingerprintedRuns.add(runMatch[1]);
            }

            const expectedLegacyLines = [
              `- 上游版本：\`${process.env.UPSTREAM_REF}\``,
              `- 架构：\`${process.env.ARCHITECTURE}\``,
              `- 目标：\`${process.env.TARGET}/${process.env.SUBTARGET}/${process.env.PROFILE}\``
            ];
            const candidates = [];
            for (const comment of botComments) {
              const body = comment.body || '';
              const runMatch = body.match(runPattern);
              if (!runMatch) continue;
              const markerMatch = body.match(fingerprintPattern);
              const exactMatch = markerMatch?.[1] === fingerprint;
              const legacyMatch = !markerMatch &&
                !fingerprintedRuns.has(runMatch[1]) &&
                expectedLegacyLines.every(line => body.includes(line));
              if (exactMatch || legacyMatch) {
                candidates.push({
                  run_id: Number(runMatch[1]),
                  issue_number: comment.issue_number,
                  created_at: comment.created_at
                });
              }
            }
            candidates.sort((left, right) => right.created_at.localeCompare(left.created_at));

            let duplicate;
            for (const candidate of candidates) {
              try {
                const run = await github.rest.actions.getWorkflowRun({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  run_id: candidate.run_id
                });
                if (run.data.conclusion !== 'success') continue;
                const artifacts = await github.paginate(
                  github.rest.actions.listWorkflowRunArtifacts,
                  {
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    run_id: candidate.run_id,
                    per_page: 100
                  }
                );
                if (!artifacts.some(artifact => !artifact.expired)) continue;
                duplicate = candidate;
                break;
              } catch (error) {
                if (error.status === 404) continue;
                throw error;
              }
            }

            if (duplicate) {
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                labels: ['duplicate']
              });
              const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${duplicate.run_id}`;
              const issueUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/issues/${duplicate.issue_number}`;
              const body = [
                '检测到过去 30 天内已有相同设备和上游提交的成功构建，本申请不占用自动构建额度，也不会重复编译。',
                '',
                `- 上游版本：\`${process.env.UPSTREAM_REF}\``,
                `- 上游提交：\`${upstreamSha}\``,
                `- 目标：\`${process.env.TARGET}/${process.env.SUBTARGET}/${process.env.PROFILE}\``,
                `- [查看原申请 #${duplicate.issue_number}](${issueUrl})`,
                `- [下载之前的构建产物](${runUrl})`
              ].join('\n');
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body
              });
              return 'duplicate';
            }

            await ensureLabel('build-review-pending', 'c5def5', 'Validated request waiting for queue review');
            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              labels: ['build-review-pending']
            });
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `参数和重复构建检查已通过，Bot 正在按申请顺序分配自动构建名额。\n\n[查看审核运行](${runUrl})`
            });
            try {
              const repository = await github.rest.repos.get({
                owner: context.repo.owner,
                repo: context.repo.repo
              });
              await github.rest.actions.createWorkflowDispatch({
                owner: context.repo.owner,
                repo: context.repo.repo,
                workflow_id: 'queue-controller.yml',
                ref: repository.data.default_branch
              });
            } catch (error) {
              core.warning(`Queue controller dispatch failed; scheduled reconciliation will retry: ${error.message}`);
            }
            return 'pending';
