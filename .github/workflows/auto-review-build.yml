name: Auto-review Firmware Build Request
run-name: Review firmware request #${{ github.event.issue.number }} by @${{ github.actor }}

on:
  issues:
    types:
      - opened
      - reopened

permissions:
  actions: write
  contents: read
  issues: write

jobs:
  review:
    name: Validate and rate-limit request
    if: >-
      github.event.issue.state == 'open' &&
      contains(github.event.issue.labels.*.name, 'build-firmware') &&
      !contains(github.event.issue.labels.*.name, 'approved-build') &&
      !contains(github.event.issue.labels.*.name, 'build-review-pending') &&
      !contains(github.event.issue.labels.*.name, 'build-queued') &&
      !contains(github.event.issue.labels.*.name, 'build-dispatching') &&
      !contains(github.event.issue.labels.*.name, 'needs-owner-review') &&
      !contains(github.event.issue.labels.*.name, 'duplicate') &&
      !contains(github.event.issue.labels.*.name, 'force-build') &&
      !contains(github.event.issue.labels.*.name, 'build-attention')
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout builder
        uses: actions/checkout@v5

      - name: Parse build request
        id: request
        continue-on-error: true
        env:
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: python3 scripts/parse-build-issue.py

      - name: Report invalid request
        if: steps.request.outcome != 'success'
        uses: actions/github-script@v8
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: '自动审核未通过：构建参数无效或模板结构已被修改。请使用 `Firmware build` 模板重新提交；仓库所有者也不应批准未经校验的参数。'
            });

      - name: Resolve upstream ref
        id: upstream
        if: steps.request.outcome == 'success'
        continue-on-error: true
        uses: actions/github-script@v8
        env:
          UPSTREAM_REF: ${{ steps.request.outputs.upstream_ref }}
        with:
          result-encoding: string
          script: |
            const commit = await github.rest.repos.getCommit({
              owner: 'fanchmwrt',
              repo: 'fanchmwrt',
              ref: process.env.UPSTREAM_REF
            });
            return commit.data.sha;

      - name: Report invalid upstream ref
        if: steps.request.outcome == 'success' && steps.upstream.outcome != 'success'
        uses: actions/github-script@v8
        env:
          UPSTREAM_REF: ${{ steps.request.outputs.upstream_ref }}
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `自动审核未通过：上游 \`${process.env.UPSTREAM_REF}\` 不存在或无法解析。本次申请不进入构建计数。`
            });

      - name: Checkout upstream target metadata
        if: steps.upstream.outcome == 'success'
        uses: actions/checkout@v5
        with:
          repository: fanchmwrt/fanchmwrt
          ref: ${{ steps.upstream.outputs.result }}
          path: target-source
          fetch-depth: 1

      - name: Resolve FanchmWrt device profile
        id: target
        if: steps.upstream.outcome == 'success'
        continue-on-error: true
        env:
          TARGET: ${{ steps.request.outputs.target }}
          SUBTARGET: ${{ steps.request.outputs.subtarget }}
          PROFILE: ${{ steps.request.outputs.profile }}
          ARCHITECTURE: ${{ steps.request.outputs.architecture }}
          DEVICE_BACKPORT_REPOSITORY: ${{ vars.DEVICE_BACKPORT_REPOSITORY || 'nd002723/fanchmwrt-device-backports' }}
          DEVICE_BACKPORT_REF: ${{ vars.DEVICE_BACKPORT_REF || 'main' }}
        run: bash ./scripts/resolve-device-profile.sh target-source "$TARGET" "$SUBTARGET" "$PROFILE" "$ARCHITECTURE"

      - name: Report invalid OpenWrt target
        if: steps.target.outcome != 'success' && steps.target.outcome != 'skipped'
        uses: actions/github-script@v8
        env:
          TARGET: ${{ steps.request.outputs.target }}
          SUBTARGET: ${{ steps.request.outputs.subtarget }}
          PROFILE: ${{ steps.request.outputs.profile }}
          ARCHITECTURE: ${{ steps.request.outputs.architecture }}
        with:
          script: |
            const requested = `${process.env.TARGET}/${process.env.SUBTARGET}/${process.env.PROFILE}`;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: [
                `自动审核未通过：检测不到设备 \`${requested}\`（架构 \`${process.env.ARCHITECTURE}\`）。`,
                '',
                '解析顺序是先看所选 FanchmWrt 版本，再看设备补丁仓库；两处都没有这个 profile，或它与架构不匹配。本次申请不会进入正式编译，也不计入每日额度。',
                '',
                '处理办法：确认 target、subtarget、profile 用的是 OpenWrt 原始命名；设备确实存在但没被收录时，请在设备补丁仓库补上再申请。'
              ].join('\n')
            });

      - name: Check duplicates and enqueue review
        id: review
        if: steps.target.outcome == 'success'
        uses: actions/github-script@v8
        env:
          UPSTREAM_REF: ${{ steps.request.outputs.upstream_ref }}
          UPSTREAM_SHA: ${{ steps.upstream.outputs.result }}
          ARCHITECTURE: ${{ steps.request.outputs.architecture }}
          TARGET: ${{ steps.request.outputs.target }}
          SUBTARGET: ${{ steps.request.outputs.subtarget }}
          PROFILE: ${{ steps.request.outputs.profile }}
        with:
          result-encoding: string
          script: |
            const { findDuplicate, planFor, reuseCutoff } = require('./scripts/lib/duplicate-build-guard.js');
            const { ensureLabel } = require('./scripts/lib/labels.js');
            const { owner, repo } = context.repo;

            const upstreamRef = process.env.UPSTREAM_REF;
            const upstreamSha = process.env.UPSTREAM_SHA;
            const fields = [
              upstreamSha,
              process.env.ARCHITECTURE,
              process.env.TARGET,
              process.env.SUBTARGET,
              process.env.PROFILE,
              upstreamRef
            ];
            const cutoff = reuseCutoff(Date.now());

            // Reuse window: only issues labelled `approved-build` can carry a
            // success comment, and only comments inside the window matter.
            const approvedIssues = await github.paginate(
              github.rest.issues.listForRepo,
              {
                owner, repo, state: 'all', labels: 'approved-build',
                sort: 'updated', direction: 'desc', per_page: 100
              },
              (response, done) => {
                const recent = response.data.filter(issue =>
                  !issue.pull_request && issue.updated_at >= cutoff
                );
                if (response.data.some(issue => issue.updated_at < cutoff)) done();
                return recent;
              }
            );

            // `findDuplicate` needs the comments of those issues; fetch them in
            // parallel and hand the module a plain world object.
            const commentGroups = await Promise.all(approvedIssues.map(async issue => ({
              issue,
              comments: await github.paginate(github.rest.issues.listComments, {
                owner, repo, issue_number: issue.number, per_page: 100
              })
            })));
            const world = { issues: new Map(), runs: new Map(), artifacts: new Map() };
            for (const group of commentGroups) {
              world.issues.set(group.issue.number, {
                updated_at: group.issue.updated_at,
                comments: group.comments.map(comment => ({
                  user: comment.user?.login,
                  created_at: comment.created_at,
                  body: comment.body || ''
                }))
              });
            }

            // Resolve only the runs the module actually asks about: a stale
            // comment costs nothing when it does not survive the filters.
            const { candidates } = planFor(fields.slice(0, 5), {
              world,
              candidateIssueNumber: context.issue.number,
              cutoff
            });
            for (const candidate of candidates) {
              const key = String(candidate.run_id);
              if (world.runs.has(key)) continue;
              try {
                const run = await github.rest.actions.getWorkflowRun({
                  owner, repo, run_id: candidate.run_id
                });
                world.runs.set(key, { conclusion: run.data.conclusion });
                const artifacts = await github.paginate(
                  github.rest.actions.listWorkflowRunArtifacts,
                  { owner, repo, run_id: candidate.run_id, per_page: 100 }
                );
                world.artifacts.set(key, artifacts);
              } catch (error) {
                if (error.status !== 404) throw error;
                world.runs.set(key, { missing: true });
              }
            }

            const duplicate = findDuplicate({
              current: fields.slice(0, 5),
              candidate: { issueNumber: context.issue.number },
              world,
              cutoff,
              upstreamRef
            });

            if (duplicate) {
              await github.rest.issues.addLabels({
                owner, repo, issue_number: context.issue.number, labels: ['duplicate']
              });
              const runUrl = `${context.serverUrl}/${owner}/${repo}/actions/runs/${duplicate.runId}`;
              const issueUrl = `${context.serverUrl}/${owner}/${repo}/issues/${duplicate.issueNumber}`;
              const body = [
                '检测到过去 30 天内已有相同设备和上游提交的成功构建，本申请不占用自动构建额度，也不会重复编译。',
                '',
                `- 上游版本：\`${upstreamRef}\``,
                `- 上游提交：\`${upstreamSha}\``,
                `- 架构：\`${process.env.ARCHITECTURE}\``,
                `- 目标：\`${process.env.TARGET}/${process.env.SUBTARGET}/${process.env.PROFILE}\``,
                `- [查看原申请 #${duplicate.issueNumber}](${issueUrl})`,
                `- [下载之前的构建产物](${runUrl})`,
                '',
                '确实需要重新编译时：新建一次申请；仓库所有者添加 `approved-build` 与 `force-build` 即可跳过查重。'
              ].join('\n');
              await github.rest.issues.createComment({
                owner, repo, issue_number: context.issue.number, body
              });
              // Close it: a duplicate needs no pull request of its own, and the
              // requester's next step starts from a new issue either way.
              // Reopening is skipped by the job-level `if`, which already refuses
              // issues carrying `duplicate`.
              await github.rest.issues.update({
                owner, repo, issue_number: context.issue.number,
                state: 'closed', state_reason: 'completed'
              });
              return 'duplicate';
            }

            await ensureLabel(github, context, 'build-review-pending');
            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              labels: ['build-review-pending']
            });
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `参数和重复构建检查已通过，Bot 正在按申请顺序分配自动构建名额。\n\n[查看审核运行](${runUrl})`
            });
            try {
              const repository = await github.rest.repos.get({
                owner: context.repo.owner,
                repo: context.repo.repo
              });
              await github.rest.actions.createWorkflowDispatch({
                owner: context.repo.owner,
                repo: context.repo.repo,
                workflow_id: 'queue-controller.yml',
                ref: repository.data.default_branch
              });
            } catch (error) {
              core.warning(`Queue controller dispatch failed; scheduled reconciliation will retry: ${error.message}`);
            }
            return 'pending';
